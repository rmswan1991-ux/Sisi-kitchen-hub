<script>
(()=>{'use strict';
const GROUPS=JSON.parse(document.getElementById('mep-data').textContent);
const DAYS=['MON','TUE','WED','THU','FRI','SAT','SUN'];
const LONG=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const ORDER_GROUPS=JSON.parse(document.getElementById('ordering-data').textContent);
const SUPPLIERS=['Wellocks','Dunns','Gilmores','Corrigans','Mexgrocer','Kidds Consumables'];
const ORDER_PRODUCTS=ORDER_GROUPS.flatMap(g=>g.products.map(p=>({...p,sourceSupplier:g.supplier,sectionId:g.id})));
const ORDER_BY_ID=Object.fromEntries(ORDER_PRODUCTS.map(p=>[p.id,p]));
const ITEMS=GROUPS.flatMap(g=>g.components.map(c=>({...c,dish:g.name,dishId:g.id})));
const BY_ID=Object.fromEntries(ITEMS.map(i=>[i.id,i]));
const STORAGE='sisi-kitchen-hub-demo-v2';
const cloud={mode:'boot',client:null,user:null,kitchen:null,role:'chef',status:'not connected',base:new Map(),pending:new Map(),inflight:new Map(),busy:false,channel:null,working:false};
let saved=false;
const blank=()=>({version:2,weeks:{},orders:{},orderMappings:{},deepCleanWeeks:{},deepCleanExtras:{},deepCleanSignoffs:{},closeDownDays:{},closeDownSignoffs:{},handovers:{},handoverActions:{},controlTemplates:{clean:[],close:[]},crew:[],log:[],demo:false});
let state=blank();
try{const raw=localStorage.getItem(STORAGE);if(raw){const obj=JSON.parse(raw);if(obj&&obj.version===2)state={...blank(),...obj}}saved=true}catch(e){console.warn('Local storage unavailable',e)}
state.orders=state.orders||{};state.orderMappings=state.orderMappings||{};state.deepCleanWeeks=state.deepCleanWeeks||{};state.deepCleanExtras=state.deepCleanExtras||{};state.deepCleanSignoffs=state.deepCleanSignoffs||{};state.closeDownDays=state.closeDownDays||{};state.closeDownSignoffs=state.closeDownSignoffs||{};state.handovers=state.handovers||{};state.handoverActions=state.handoverActions||{};state.controlTemplates=state.controlTemplates||{clean:[],close:[]};
const localDate=(dt)=>`${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const today=new Date();const monday=new Date(today.getFullYear(),today.getMonth(),today.getDate());monday.setDate(monday.getDate()-((monday.getDay()+6)%7));
let week=localDate(monday),day=(today.getDay()+6)%7,view='home',search='';
const ukNow=()=>{const o={};for(const p of new Intl.DateTimeFormat('en-GB',{timeZone:'Europe/London',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date())){if(p.type!=='literal')o[p.type]=p.value}return {date:o.year+'-'+o.month+'-'+o.day,mins:Number(o.hour)*60+Number(o.minute)}};
const addDays=(s,n)=>{const d=new Date(s+'T12:00:00Z');d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10)};
const weekday=(s)=>new Date(s+'T12:00:00Z').getUTCDay();
const dateNice=(s)=>new Date(s+'T12:00:00Z').toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
let closeDate=ukNow().date;
let handoverDate=ukNow().date;
let deliveryDate=addDays(ukNow().date,1),orderOpen='Dunns';if(weekday(deliveryDate)===0)deliveryDate=addDays(deliveryDate,1);
const openGroups=new Set([GROUPS[0].id]);
const W=()=>{if(!state.weeks[week])state.weeks[week]={};return state.weeks[week]};
const dkey=(dayIndex,id)=>`${dayIndex}|${id}`;
const find=(d,id)=>W()[dkey(d,id)];
const allDay=(d)=>Object.entries(W()).filter(([k,v])=>k.startsWith(d+'|')&&v).map(([k,v])=>({...v,id:k.split('|').slice(1).join('|'),day:d})).filter(a=>BY_ID[a.id]);
const fmt=(s)=>new Date(s+'T12:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'});
const nweek=(plus)=>{const d=new Date(week+'T12:00:00');d.setDate(d.getDate()+7*plus);week=localDate(d);if(view!=='clean'&&view!=='closedown')view='today';paint()};
const dateOf=(d)=>{const a=new Date(week+'T12:00:00');a.setDate(a.getDate()+d);return a};
const esc=(x)=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const persist=()=>{if(cloud.mode==='live'){queueCloudChanges();return;}try{localStorage.setItem(STORAGE,JSON.stringify(state));saved=true}catch(e){saved=false}};
const cleanUnusedMEP=()=>{let removed=0;for(const tasks of Object.values(state.weeks||{})){if(!tasks||typeof tasks!=='object')continue;for(const key of Object.keys(tasks)){const id=key.slice(key.indexOf('|')+1);if(!Object.hasOwn(BY_ID,id)){delete tasks[key];removed++}}}return removed};
if(cleanUnusedMEP())persist();
const makeId=()=>typeof crypto!=='undefined'&&typeof crypto.randomUUID==='function'?crypto.randomUUID():'log-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2);
const track=(message)=>{state.log.unshift({id:makeId(),at:new Date().toISOString(),by:cloud.mode==='live'?(cloud.user?.email||'Staff'):'Device',message});state.log=state.log.slice(0,80)};
const setTask=(d,id,patch)=>{const key=dkey(d,id);W()[key]={status:'todo',qc:'pending',owner:'',quantity:'',note:'',...W()[key],...patch};persist();paint()};
const schedule=(d,id)=>{if(!allowed('manage'))return;const key=dkey(d,id);if(W()[key]){delete W()[key];track(`Removed ${BY_ID[id].name} from ${LONG[d]}`)}else{W()[key]={status:'todo',qc:'pending',owner:'',quantity:'',note:''};track(`Planned ${BY_ID[id].name} for ${LONG[d]}`)}persist();paint()};
const counts=(d)=>{const a=allDay(d);return {total:a.length,done:a.filter(t=>t.status==='done').length,issue:a.filter(t=>t.status==='issue'||t.qc==='rework').length,working:a.filter(t=>t.status==='doing').length,needQC:a.filter(t=>t.status==='done'&&t.qc!=='passed').length,passed:a.filter(t=>t.status==='done'&&t.qc==='passed').length}};
const weekly=()=>DAYS.map((_,d)=>counts(d));
const dayChips=()=>`<div class="daystrip">${DAYS.map((n,d)=>`<button class="day ${day===d?'active':''}" data-day="${d}" aria-label="${LONG[d]}"><strong>${n}</strong><span>${dateOf(d).getDate()}</span><i class="tiny"></i></button>`).join('')}</div>`;
function header(){if(view==='home'){document.getElementById('top').innerHTML=`<div class="topline"><div class="logo"><div class="mark">S</div><div><div class="eyebrow">SISI · KITCHEN OPERATIONS</div><div class="brand">KITCHEN HUB</div></div></div><span class="syncbadge"><i class="dot"></i>${cloud.mode==='live'?(cloud.pending.size||cloud.inflight.size?'Sync pending':cloud.status):cloud.mode==='demo'?'Device demo':'Sign-in needed'}</span></div><div class="homeTopline"><span class="homeEyebrow">HEAD CHEF DASHBOARD</span><span class="homeDate">${new Date().toLocaleDateString('en-GB',{timeZone:'Europe/London',weekday:'short',day:'numeric',month:'short'})}</span></div><h1 class="homeGreeting">${helloNow()},<br><em>Head Chef.</em></h1><p class="homeTagline">FAIL TO PREPARE, PREPARE TO FAIL.</p>`;return;}document.getElementById('top').innerHTML=`<div class="topline"><div class="logo"><div class="mark">S</div><div><div class="eyebrow">KITCHEN OPERATIONS</div><div class="brand">SiSi KITCHEN HUB</div></div></div><span class="syncbadge"><i class="dot"></i>${cloud.mode==='live'?(cloud.pending.size||cloud.inflight.size?'Sync pending':cloud.status):cloud.mode==='demo'?'Device-only demo':'Sign-in needed'}</span></div><div class="hero"><h1 class="${view==='today'?'motto':''}">${view==='today'?'FAIL TO PREPARE, <span class="mottoBreak">PREPARE TO FAIL</span>':view==='plan'?'Plan the week.':view==='review'?'Head Chef review.':view==='orders'?'Supplier ordering.':view==='clean'?'Deep clean.':view==='closedown'?'Kitchen close-down.':view==='handover'?'Daily handover.':view==='control'?'Head Chef control panel.':'Kitchen settings.'}</h1><p>${view==='today'?'Less paperwork. More ownership.':view==='plan'?'Your full MEP, ready to schedule in a tap.':view==='review'?'Know what is done, checked and still outstanding.':view==='orders'?'Correct deliveries. Confirmed orders. No missed cut-offs.':view==='clean'?'One weekly list. Clear ownership. Signed off to standard.':view==='closedown'?'Every shift. Every station. Properly signed off.':view==='handover'?'Pass on the details. Own the next shift.':'Set up the team and protect your data.'}</p></div><div class="weekbar" style="${['orders','closedown','handover'].includes(view)?'display:none':''}"><div><div class="weekname">WEEK COMMENCING</div><div class="weekvalue">${fmt(week)} — ${fmt(localDate(dateOf(6)))}</div></div><div class="weekbuttons"><button class="iconbtn" data-week="-1" aria-label="Previous week">‹</button><button class="iconbtn" data-week="1" aria-label="Next week">›</button></div></div>`;}
function navigation(){const defs=(cloud.mode==='live'&&cloud.role==='chef'?[['today','☑','Prep'],['closedown','☾','Close'],['handover','↗','Handover'],['settings','⚙','Account']]:[['home','⌂','Home'],['today','☑','Prep'],['orders','▣','Orders'],['clean','◈','Clean'],['closedown','☾','Close'],['handover','↗','Handover'],['review','▤','Review'],...(cloud.mode==='live'&&cloud.role==='head'||cloud.mode==='demo'?[['control','⚙','Control']]:[]),['settings','⚙','More']]);const totalIssue=weekly().reduce((a,b)=>a+b.issue,0);document.getElementById('nav').innerHTML=defs.map(([k,i,label])=>`<button data-nav="${k}" class="${view===k?'active':''}" aria-label="${label}"><span class="navicon">${i}${k==='review'&&totalIssue?`<span class="badgeN">${totalIssue}</span>`:''}</span>${label}</button>`).join('')}
function jobLine(t,review=false){const meta=BY_ID[t.id];const isDone=t.status==='done',bad=t.status==='issue'||t.qc==='rework';const statusClass=bad?'issue':isDone?'done':t.status==='doing'?'working':'';const ico=bad?'!':isDone?'✓':t.status==='doing'?'◔':'';const st=bad?'Issue':isDone?'Done':t.status==='doing'?'In progress':'To do';const quality=isDone?(t.qc==='passed'?'<span class="pill qc">QC PASSED</span>':`<span class="pill ${t.qc==='rework'?'rework':'todo'}">${t.qc==='rework'?'QC REWORK':'QC PENDING'}</span>`):'';const d=review?t.day:day;return `<div class="jobrow"><button class="tick ${statusClass}" data-tick="${esc(t.id)}" data-td="${d}" title="Toggle done" aria-label="Mark ${esc(meta.name)} ${isDone?'to do':'done'}">${ico}</button><div class="jobtext"><div class="jobname">${esc(meta.name)}</div><div class="jobmeta"><span class="pill ${bad?'issue':t.status==='doing'?'progress':isDone?'done':'todo'}">${st}</span>${quality}${t.owner?`<span>${esc(t.owner)}</span>`:''}${t.quantity?`<span> · ${esc(t.quantity)}</span>`:''}${review?`<span> · ${LONG[t.day].slice(0,3)}</span>`:''}${t.note?`<div><strong>${esc(t.note)}</strong></div>`:''}</div></div>${review&&isDone&&t.qc==='pending'?`<button class="manage" style="min-width:44px;background:var(--lime);color:var(--dark);border-color:var(--lime);font-size:12px;font-weight:800" data-approve="${esc(t.id)}" data-td="${d}" aria-label="Pass quality check">QC ✓</button>`:''}<button class="manage" data-edit="${esc(t.id)}" data-td="${d}" aria-label="Edit ${esc(meta.name)}">···</button></div>`}
function panelsFor(tasks,review=false){const list=GROUPS.map(g=>{const members=tasks.filter(t=>BY_ID[t.id]?.dishId===g.id);if(!members.length)return '';return `<article class="panel"><div class="panelhead"><h3>${esc(g.name)}</h3><span class="count">${members.filter(t=>t.status==='done').length} / ${members.length} done</span></div>${members.map(x=>jobLine(x,review)).join('')}</article>`}).join('');return list;}

function reviewScreen(){const weekStats=weekly();const total=weekStats.reduce((a,b)=>a+b.total,0),done=weekStats.reduce((a,b)=>a+b.done,0),issue=weekStats.reduce((a,b)=>a+b.issue,0),pending=weekStats.reduce((a,b)=>a+b.needQC,0);const items=DAYS.flatMap((_,d)=>allDay(d));const risks=items.filter(t=>t.status==='issue'||t.qc==='rework');const check=items.filter(t=>t.status==='done'&&t.qc==='pending');return `<div class="sectionTitle"><div><h2>Weekly overview</h2><p>${fmt(week)} — ${fmt(localDate(dateOf(6)))}</p></div><button class="smalllink" data-export="yes">Export ↗</button></div><div class="stats"><div class="stat highlight"><div class="big">${done}/${total}</div><div class="tag">PREP DONE</div></div><div class="stat"><div class="big">${pending}</div><div class="tag">QC PENDING</div></div><div class="stat"><div class="big">${issue}</div><div class="tag">ISSUES</div></div></div><div class="subheading">BY DAY</div>${DAYS.map((_,d)=>{const x=weekStats[d],pct=x.total?Math.round(x.done/x.total*100):0;return `<button data-reviewday="${d}" class="weekcard" style="width:100%;color:inherit;text-align:left"><div><h3>${LONG[d]} · ${dateOf(d).getDate()} ${fmt(week).split(' ').slice(-1)[0]}</h3><small>${x.done} of ${x.total} done${x.needQC?` · ${x.needQC} awaiting QC`:''}${x.issue?` · ${x.issue} issue${x.issue>1?'s':''}`:''}</small></div><div class="barbox" aria-label="${pct}% done"><div style="width:${pct}%"></div></div></button>`}).join('')}<div class="subheading">ISSUES & REWORK (${risks.length})</div>${risks.length?risks.map(t=>`<div class="issueItem"><h4>${esc(BY_ID[t.id].name)} · ${LONG[t.day]}</h4><p>${esc(t.note||'No handover note recorded. Add a clear action and owner.')}</p><button data-edit="${esc(t.id)}" data-td="${t.day}">Open issue ↗</button></div>`).join(''):'<div class="notice">No recorded issues or failed checks this week.</div>'}<div class="subheading">DONE · AWAITING QUALITY CHECK (${check.length})</div>${check.length?panelsFor(check,true):'<div class="notice  }
 if(unassigned.length){html+=`<h2 class="orderTitle">Products needing a supplier</h2><p class="orderIntro">Your original workbook lists these as categories, not suppliers. Assign a whole section or individual products once; they'll then appear under the correct supplier automatically.</p>`;
 for(const g of unassigned){html+=`<details class="supplierCard"><summary><div><h3>${esc(g.name)}</h3><small>${g.missing.length} products not yet routed</small></div><span class="orderPill warn">Assign</span></summary><div class="orderInner"><div class="orderMapping"><span><b>Assign entire section</b></span>${selectSupplier(state.orderMappings['section:'+g.id]||'','section:'+g.id)}</div>${g.missing.map(p=>`<div class="orderMapping"><span>${esc(p.name)}</span>${selectSupplier(state.orderMappings[p.id]||'',p.id)}</div>`).join('')}</div></details>`;}}

function quantityUpdate(supplier,pid,value){if(!allowed('manage'))return;if(!SUPPLIERS.includes(supplier)||!ORDER_BY_ID[pid]||supplierFor(ORDER_BY_ID[pid])!==supplier||!supplierAvailable(supplier,deliveryDate))return;const r=O()[supplier]||{qty:{},status:'unreviewed'};if(r.status==='submitted')return;const n=Math.max(0,Math.min(999,Math.floor(Number(value)||0)));r.qty=r.qty||{};if(n)r.qty[pid]=n;else delete r.qty[pid];r.status='draft';r.preparedAt='';O()[supplier]=r;orderOpen=supplier;persist();paint()}

 if(action==='prepared'){if(!amount){alert('Select at least one product first.');return;}r.status='prepared';r.preparedAt=new Date().toISOString();track(`${supplier} order prepared for ${deliveryDate} — NOT submitted`)}
 if(action==='submitted'){if(!amount){alert('Select at least one product first.');return;}if(!confirm(`Have you ACTUALLY placed the ${supplier} order for delivery ${dateNice(deliveryDate)}?\n\nOnly confirm after the supplier has received it.`))return;const ref=prompt('Confirmation / order reference (optional):','');if(ref===null)return;r.status='submitted';r.confirmation=ref.trim().slice(0,100);r.submittedAt=new Date().toLocaleString('en-GB',{timeZone:'Europe/London',dateStyle:'short',timeStyle:'short'});r.submittedISO=new Date().toISOString();r.submittedBy=cloud.mode==='live'?(cloud.user?.email||'Staff'):'Device';r.late=due<now.date||(due===now.date&&now.mins>=1320);track(`${supplier} order CONFIRMED as sent for ${deliveryDate}${r.late?' (after cut-off)':''}`)}

 O()[supplier]=r;orderOpen=supplier;persist();paint()
}

function flattenCloud(s){const map=new Map();
 for(const [w,jobs] of Object.entries(s.weeks||{}))for(const [t,val] of Object.entries(jobs||{}))if(val)map.set('w/'+w+'/'+t,val);
 for(const [date,records] of Object.entries(s.orders||{}))for(const [supplier,val] of Object.entries(records||{}))if(val){const q=val.qty||{},rest={...val};delete rest.qty;map.set('s/'+date+'/'+encodeURIComponent(supplier),rest);for(const [pid,n] of Object.entries(q))if(n)map.set('q/'+date+'/'+encodeURIComponent(supplier)+'/'+encodeURIComponent(pid),Number(n))}
 for(const [wk,records] of Object.entries(s.deepCleanWeeks||{}))for(const [id,val] of Object.entries(records||{}))if(val)map.set('dc/'+wk+'/'+encodeURIComponent(id),val);
 for(const [wk,extras] of Object.entries(s.deepCleanExtras||{}))for(const j of extras||[])if(j.id)map.set('dx/'+wk+'/'+encodeURIComponent(j.id),j);
 for(const [wk,val] of Object.entries(s.deepCleanSignoffs||{}))if(val)map.set('ds/'+wk,val);
 for(const [date,records] of Object.entries(s.closeDownDays||{}))for(const [id,val] of Object.entries(records||{}))if(val)map.set('cd/'+date+'/'+encodeURIComponent(id),val);
 for(const [date,sign] of Object.entries(s.closeDownSignoffs||{}))if(sign)map.set('cs/'+date,sign);
 for(const [date,report] of Object.entries(s.handovers||{}))if(report)map.set('ho/'+date,report);
 for(const [id,action] of Object.entries(s.handoverActions||{}))if(action)map.set('ha/'+encodeURIComponent(id),action);
  for(const kind of ['clean','close'])for(const row of (s.controlTemplates?.[kind]||[]))if(row.from)map.set('ct/'+kind+'/'+row.from,row);
 for(const [key,val] of Object.entries(s.orderMappings||{}))if(val)map.set('m/'+encodeURIComponent(key),val);
 map.set('crew',s.crew||[]);
 for(const item of (s.log||[]))if(item.id)map.set('l/'+item.id,item);
 return map;
}

  if(key.startsWith('cd/')){const idx=key.indexOf('/',3),date=key.slice(3,idx),id=decodeURIComponent(key.slice(idx+1));if(!state.closeDownDays[date])state.closeDownDays[date]={};if(val===null)delete state.closeDownDays[date][id];else state.closeDownDays[date][id]=val;return}
  if(key.startsWith('cs/')){const date=key.slice(3);if(val===null)delete state.closeDownSignoffs[date];else state.closeDownSignoffs[date]=val;return}
   if(key.startsWith('ho/')){const date=key.slice(3);if(val===null)delete state.handovers[date];else state.handovers[date]=val;return}
   if(key.startsWith('ha/')){const id=decodeURIComponent(key.slice(3));if(val===null)delete state.handoverActions[id];else state.handoverActions[id]=val;return}
  if(key.startsWith('dc/')){const idx=key.indexOf('/',3),wk=key.slice(3,idx),id=decodeURIComponent(key.slice(idx+1));if(!state.deepCleanWeeks[wk])state.deepCleanWeeks[wk]={};if(val===null)delete state.deepCleanWeeks[wk][id];else state.deepCleanWeeks[wk][id]=val;return}
  if(key.startsWith('dx/')){const idx=key.indexOf('/',3),wk=key.slice(3,idx),id=decodeURIComponent(key.slice(idx+1));if(!state.deepCleanExtras[wk])state.deepCleanExtras[wk]=[];state.deepCleanExtras[wk]=state.deepCleanExtras[wk].filter(j=>j.id!==id);if(val)state.deepCleanExtras[wk].push(val);return}
  if(key.startsWith('ds/')){const wk=key.slice(3);if(val===null)delete state.deepCleanSignoffs[wk];else state.deepCleanSignoffs[wk]=val;return}
  if(key.startsWith('m/')){const id=decodeURIComponent(key.slice(2));if(val===null)delete state.orderMappings[id];else state.orderMappings[id]=val;return}
 if(key.startsWith('l/')){state.log=state.log.filter(i=>i.id!==key.slice(2));if(val)state.log.unshift(val);state.log.sort((a,b)=>(b.at||'').localeCompare(a.at||''));state.log=state.log.slice(0,80)}
}
function pendingStorage(){return cloud.kitchen&&cloud.user?`sisi-pending-${cloud.kitchen.id}-${cloud.user.id}`:''}
function persistPending(){try{const key=pendingStorage();if(key)localStorage.setItem(key,JSON.stringify([...cloud.pending]))}catch(e){}}
function restorePending(){try{const items=JSON.parse(localStorage.getItem(pendingStorage())||'[]');for(const [k,v] of items){cloud.pending.set(k,v);applyCloudKey(k,v)}}catch(e){}}
async function reloadCloud(first=false){
 let all=[];let from=0;for(;;){const {data,error}=await cloud.client.from('kitchen_data').select('item_key,item_value').eq('kitchen_id',cloud.kitchen.id).range(from,from+999);if(error)throw error;all.push(...data);if(data.length<1000)break;from+=1000}
 const rows=new Map(all.map(x=>[x.item_key,x.item_value]));
 if(first){state=blank();cloud.base=rows;for(const [k,v] of rows)applyCloudKey(k,v);restorePending();cleanUnusedMEP();if(cloud.pending.size){persistPending();void flushCloud()}}
 else {const preserve=new Map([...cloud.pending,...cloud.inflight]);state=blank();cloud.base=rows;for(const [k,v] of rows)applyCloudKey(k,v);for(const [k,v] of preserve)applyCloudKey(k,v)}
 paint();
}
function queueCloudChanges(){
 if(cloud.mode!=='live')return;
 const now=flattenCloud(state),known=new Map([...cloud.base,...cloud.pending,...cloud.inflight]);
 for(const [k,v] of now)if(JSON.stringify(known.get(k))!==JSON.stringify(v))cloud.pending.set(k,v);
 for(const [k] of known)if(!now.has(k))cloud.pending.set(k,null);
 persistPending();cloud.status=cloud.pending.size||cloud.inflight.size?'Sync pending':'Live · shared';paint();void flushCloud();
}
async function flushCloud(){
 if(cloud.busy||cloud.mode!=='live'||!cloud.pending.size)return;
 cloud.busy=true;const entries=[...cloud.pending].slice(0,75);for(const [k,v] of entries){cloud.pending.delete(k);cloud.inflight.set(k,v)}persistPending();
 try{
  const rows=entries.filter(([k,v])=>v!==null).map(([k,v])=>({kitchen_id:cloud.kitchen.id,item_key:k,item_value:v}));
  if(rows.length){const {error}=await cloud.client.from('kitchen_data').upsert(rows,{onConflict:'kitchen_id,item_key'});if(error)throw error}
  for(const [key,val] of entries)if(val===null){const {error}=await cloud.client.from('kitchen_data').delete().eq('kitchen_id',cloud.kitchen.id).eq('item_key',key);if(error)throw error}
  for(const [k,v] of entries){cloud.base.set(k,v);if(v===null)cloud.base.delete(k);cloud.inflight.delete(k)}
  cloud.status=cloud.pending.size?'Sync pending':'Live · shared';persistPending();
 }catch(e){for(const [k,v] of entries){cloud.inflight.delete(k);if(!cloud.pending.has(k))cloud.pending.set(k,v)}persistPending();cloud.status='Offline / sync failed';console.warn('SiSi sync error',e);showSyncNotice(e.message)}
 finally{cloud.busy=false;paint();if(cloud.pending.size&&cloud.status!=='Offline / sync failed')void flushCloud()}
}
function showSyncNotice(msg){let banner=document.getElementById('syncwarning');if(!banner){banner=document.createElement('div');banner.id='syncwarning';banner.className='livewarn';document.getElementById('screen').prepend(banner)}banner.textContent='Changes not synced yet: '+msg+' · They are queued on this phone. Use Retry sync in Settings.'}
function listenCloud(){if(cloud.channel){void cloud.client.removeChannel(cloud.channel)}cloud.channel=cloud.client.channel('sisi-'+cloud.kitchen.id)
 .on('postgres_changes',{event:'*',schema:'public',table:'kitchen_data',filter:'kitchen_id=eq.'+cloud.kitchen.id},payload=>{
  const row=payload.eventType==='DELETE'?payload.old:payload.new;if(!row?.item_key)return;
  const key=row.item_key,val=payload.eventType==='DELETE'?null:row.item_value;
  if(cloud.pending.has(key)||cloud.inflight.has(key))return;
  if(val===null)cloud.base.delete(key);else cloud.base.set(key,val);
  applyCloudKey(key,val);paint();
 }).subscribe(status=>{if(status==='SUBSCRIBED'){cloud.status=cloud.pending.size?'Sync pending':'Live · shared';paint()}});
 window.addEventListener('online',()=>{cloud.status='Sync pending';void flushCloud();void reloadCloud(false)});
 document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.mode==='live'){void reloadCloud(false)}});
}
async function cloudLogout(){if(cloud.channel)await cloud.client.removeChannel(cloud.channel);await cloud.client.auth.signOut();cloud.mode='login';cloud.user=null;cloud.kitchen=null;cloud.pending.clear();cloud.base.clear();state=blank();showLogin();paint()}
async function refreshMembers(){const {data,error}=await cloud.client.rpc('list_kitchen_members',{p_kitchen_id:cloud.kitchen.id});if(error)throw error;return data||[]}
function cloudSettings(){
 if(cloud.mode==='demo')return `<div class="settingsbox"><h3>Shared logins</h3><p>This is the device-only demo.</p><button class="primary" data-cloud-open="yes">Connect SiSi Cloud</button></div>`;
 if(cloud.mode!=='live')return '';
 return `<div class="settingsbox"><h3>Shared kitchen</h3><div class="cloudRole">${esc(cloud.kitchen.name)} · <b>${esc(cloud.role.toUpperCase())}</b><div>${esc(cloud.user.email)}</div></div><div class="notice">${esc(cloud.status)}. ${cloud.pending.size+cloud.inflight.size} changes awaiting confirmation.</div><div class="rowBtns"><button class="secondary" data-cloud-retry="yes">Retry sync</button><button class="secondary" data-cloud-logout="yes">Sign out</button></div>${cloud.role==='head'?`<div class="cloudPanel"><b>Invite the Sous Chef</b><p>Give this code privately to your Sous Chef, after they create their own account. It grants Chef access initially; you can then promote them below.</p><div style="word-break:break-all;font-size:12px;font-weight:750">${esc(cloud.kitchen.invite)}</div><button class="secondary" data-cloud-copy="yes">Copy invite code</button><button class="secondary" data-cloud-members="yes">Manage staff roles</button><div id="cloudMembers"></div></div>`:''}</div>`
}
async function showMembers(){const users=await refreshMembers(),where=document.getElementById('cloudMembers');if(!where)return;where.innerHTML=users.map(u=>`<div class="orderMapping"><span>${esc(u.email)}<br><small>${esc(u.role)}</small></span>${u.user_id===cloud.user.id?'<b>Head Chef</b>':`<select data-cloud-user="${esc(u.user_id)}"><option value="chef" ${u.role==='chef'?'selected':''}>Chef</option><option value="sous" ${u.role==='sous'?'selected':''}>Sous Chef</option></select>`}</div>`).join('');}
document.addEventListener('click',async ev=>{
 const target=ev.target.closest('[data-cloud-demo],[data-cloud-open],[data-cloud-signup],[data-cloud-login],[data-cloud-logout],[data-cloud-copy],[data-cloud-members],[data-cloud-retry]');if(!target)return;
 try{
 if(target.dataset.cloudDemo){cloud.mode='demo';gateHide();paint();return}
 if(target.dataset.cloudOpen){cloud.mode='setup';showCloudIntro();return}
 if(target.dataset.cloudSignup){showSignup();return}
 if(target.dataset.cloudLogin){showLogin();return}
 if(target.dataset.cloudLogout){await cloudLogout();return}
 if(target.dataset.cloudCopy){await navigator.clipboard.writeText(cloud.kitchen.invite);alert('Invitation code copied');return}
 if(target.dataset.cloudMembers){await showMembers();return}
 if(target.dataset.cloudRetry){cloud.status='Sync pending';await flushCloud();await reloadCloud(false);return}
 }catch(e){alert(e.message)}
});
document.addEventListener('submit',async ev=>{
 const id=ev.target.id;if(!['cloudConfig','cloudLogin','cloudSignup','cloudCreate','cloudJoin'].includes(id))return;ev.preventDefault();const f=new FormData(ev.target);const btn=ev.target.querySelector('button[type=submit]');btn.disabled=true;
 try{
  if(id==='cloudConfig'){
   cfg={url:String(f.get('url')).trim().replace(/\/$/,''),anonKey:String(f.get('key')).trim()};
   if(!/^https:\/\/[\w.-]+\.supabase\.co$/.test(cfg.url))throw Error('Enter a valid https://…supabase.co project URL.');
   if(cfg.anonKey.length<25)throw Error('The public publishable/anon key looks incomplete.');
   localStorage.setItem(KEY_PREFIX,JSON.stringify(cfg));await bootCloud();return;
  }
  if(id==='cloudLogin'){const {data,error}=await cloud.client.auth.signInWithPassword({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)throw error;cloud.user=data.user;await enterCloud();return}
  if(id==='cloudSignup'){const {data,error}=await cloud.client.auth.signUp({email:String(f.get('email')).trim(),password:String(f.get('password'))});if(error)throw error;if(data.session?.user){cloud.user=data.user;await enterCloud()}else {showLogin();gateMsg('Account created. Check your email to confirm it, then sign in.')}return}
  if(id==='cloudCreate'){const {data,error}=await cloud.client.rpc('create_kitchen',{p_name:String(f.get('name')).trim()});if(error)throw error;await enterCloud();return}
  if(id==='cloudJoin'){const {data,error}=await cloud.client.rpc('join_kitchen',{p_invite_code:String(f.get('code')).trim()});if(error)throw error;await enterCloud();return}
 }catch(e){gateMsg(e.message||'Something went wrong',true)}finally{btn.disabled=false}
});
document.addEventListener('change',async ev=>{
 if(!ev.target.dataset.cloudUser)return;
 if(cloud.role!=='head')return;
 try{const {error}=await cloud.client.rpc('set_member_role',{p_kitchen_id:cloud.kitchen.id,p_user_id:ev.target.dataset.cloudUser,p_role:ev.target.value});if(error)throw error;await showMembers()}catch(e){alert(e.message)}
});

void bootCloud();
})();
</script>
